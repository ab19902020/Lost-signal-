name: Validate Lost Signal Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Install Chromium for the visual QA harness
        run: npx playwright install --with-deps chromium

      - name: Boot the game and assert it plays
        run: |
          npm run dev -- --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://127.0.0.1:5173/Lost-signal-/" && break
            sleep 1
          done
          node qa/assert.mjs "http://127.0.0.1:5173/Lost-signal-/"

      - name: Capture visual QA views
        if: always()
        run: node qa/visual.mjs "http://127.0.0.1:5173/Lost-signal-/" qa/out/visual

      - name: Upload visual QA views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-signal-visual-qa
          path: qa/out/visual
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Blender bunker assets are present
        run: |
          test -f public/assets/blender/desk_station.glb
          test -f public/assets/blender/cctv_console_v2.glb
          test -f public/assets/blender/gun_vault_v2.glb
          test -f public/assets/blender/hunting_rifle.glb
          test -f public/assets/blender/generator.glb
          test -f public/assets/blender/blast_door_v2.glb
