name: Build Blender Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'
  pull_request:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: write

jobs:
  blender-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Install Blender and glTF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Generate premium bunker GLBs
        run: blender -b --python blender/generate_bunker_v2.py

      - name: Verify generated files
        run: |
          ls -lah public/assets/blender
          test -f public/assets/blender/desk_station.glb
          test -f public/assets/blender/radio.glb
          test -f public/assets/blender/cctv_console_v2.glb
          test -f public/assets/blender/gun_vault_v2.glb
          test -f public/assets/blender/hunting_rifle.glb
          test -f public/assets/blender/generator.glb
          test -f public/assets/blender/bed.glb
          test -f public/assets/blender/chair.glb
          test -f public/assets/blender/storage_rack.glb
          test -f public/assets/blender/blast_door_v2.glb
          test -f public/assets/blender/pipe_cluster.glb
          test -f public/assets/blender/ceiling_light.glb

      - name: Commit generated assets to source branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/blender/*.glb
          if git diff --cached --quiet; then
            echo 'No Blender asset changes to commit.'
          else
            git commit -m 'Generate premium Blender bunker assets'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
