name: Build Blender Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: write

jobs:
  blender-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate Lost Signal GLBs
        run: blender -b --python blender/generate_assets.py

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/blender/*.glb
          if git diff --cached --quiet; then
            echo 'No Blender asset changes to commit.'
          else
            git commit -m 'Generate Blender environment assets'
            git push
          fi
