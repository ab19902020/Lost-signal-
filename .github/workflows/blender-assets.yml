name: Build Blender Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: write

jobs:
  blender-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate premium bunker GLBs
        run: blender -b --python blender/generate_bunker_v2.py

      - name: Verify generated files
        run: |
          ls -lah public/assets/blender
          test -f public/assets/blender/desk_station.glb
          test -f public/assets/blender/cctv_console_v2.glb
          test -f public/assets/blender/gun_vault_v2.glb
          test -f public/assets/blender/hunting_rifle.glb
          test -f public/assets/blender/generator.glb
          test -f public/assets/blender/blast_door_v2.glb

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/blender/*.glb
          if git diff --cached --quiet; then
            echo 'No Blender asset changes to commit.'
          else
            git commit -m 'Generate premium Blender bunker assets'
            git push
          fi
