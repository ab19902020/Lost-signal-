name: Build Blender Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'
  pull_request:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: write

jobs:
  blender-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Blender and glTF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Generate Blender furniture kit
        run: blender -b --python blender/generate_bunker_v2.py

      - name: Generate Blender environment kit
        run: blender -b --python blender/generate_environment_v3.py

      - name: Generate Blender creature kit
        run: blender -b --python blender/generate_creatures_v3.py

      - name: Generate Blender habitation silo kit
        run: blender -b --python blender/generate_habitat_v4.py

      - name: Detach placeholder images so the shared textures load
        run: node tools/externalize-glb-images.mjs

      - name: Verify generated Blender library
        run: |
          ls -lah public/assets/blender
          for f in \
            desk_station.glb radio.glb cctv_console_v2.glb gun_vault_v2.glb hunting_rifle.glb generator.glb bed.glb chair.glb storage_rack.glb blast_door_v2.glb pipe_cluster.glb ceiling_light.glb \
            bunker_environment_v3.glb ventilation_unit_v3.glb electrical_wall_v3.glb locker_bank_v3.glb maintenance_bench_v3.glb survival_clutter_v3.glb status_board_v3.glb access_control_v3.glb wall_camera_v3.glb \
            exterior_ground_v3.glb exterior_entrance_v3.glb perimeter_fence_v3.glb perimeter_gate.glb floodlight.glb dead_tree.glb concrete_barrier_v3.glb rubble_cluster_v3.glb \
            deer_v3.glb rabbit_v3.glb infected_v3.glb \
            hab_shell_v4.glb hab_level_v4.glb hab_stair_v4.glb hab_hydroponics_v4.glb \
            hab_commons_v4.glb hab_secure_door_v4.glb hab_directory_v4.glb hab_landing_v4.glb \
            resident_v4.glb resident_still_v4.glb \
            access_hatch_v3.glb silo_cache_v3.glb; do
            test -s "public/assets/blender/$f" || { echo "Missing Blender asset: $f"; exit 1; }
          done

      - name: Commit generated assets to source branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # These GLBs are build output, not edits to reconcile. Re-point at the
          # branch tip and commit this run's fresh build on top of it, so a push
          # that landed while Blender was running does not turn into a binary
          # merge conflict.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"
            git add public/assets/blender/*.glb
            if git diff --cached --quiet; then
              echo 'No Blender asset changes to commit.'
              exit 0
            fi
            git commit -m 'Generate complete Blender V3 asset library'
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            echo "Push rejected, retrying against the new branch tip (attempt $attempt)."
            sleep $((attempt * 4))
          done
          echo 'Could not push generated assets after three attempts.'
          exit 1
