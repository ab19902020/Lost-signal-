name: Create direct browser preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make source browser-native for preview
        run: |
          python - <<'PY'
          from pathlib import Path
          assets = Path('src/assets.js')
          text = assets.read_text()
          text = text.replace(
              "const BASE = import.meta.env.BASE_URL;",
              "const BASE = globalThis.__LS_BASE__ || import.meta.env.BASE_URL;"
          )
          assets.write_text(text)

          html = Path('index.html').read_text()
          old = '<script type="module" src="/src/main.js"></script>'
          replacement = '''<script type="importmap">
          {
            "imports": {
              "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
              "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
          }
          </script>
          <script>window.__LS_BASE__ = new URL('./public/', location.href).href;</script>
          <script type="module" src="./src/main.js"></script>'''
          if old not in html:
              raise SystemExit('index module tag not found')
          Path('preview.html').write_text(html.replace(old, replacement))
          PY
      - name: Commit direct preview entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets.js preview.html
          if git diff --cached --quiet; then
            echo 'Direct preview already ready.'
          else
            git commit -m 'Add playable direct browser preview'
            git push
          fi
