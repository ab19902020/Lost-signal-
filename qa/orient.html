<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#111;color:#ddd;font:12px monospace}
.cell{display:inline-block;margin:2px;text-align:center}
canvas{display:block;border:1px solid #333}
</style></head><body>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const files = new URLSearchParams(location.search).get('files').split(',');
const mode = new URLSearchParams(location.search).get('mode') || 'raw';
const view = new URLSearchParams(location.search).get('view') || 'iso';
const S = parseInt(new URLSearchParams(location.search).get('size')||'340',10);
const loader = new GLTFLoader();
const grid = document.getElementById('grid');

for (const file of files) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(S, S);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  wrap.appendChild(renderer.domElement);
  const label = document.createElement('div');
  label.textContent = file.replace('.glb','');
  wrap.appendChild(label);
  grid.appendChild(wrap);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1d1c);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(3,5,4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 1.2); rim.position.set(-4,2,-3); scene.add(rim);

  const gltf = await loader.loadAsync('../assets/blender/' + file);
  let root = gltf.scene;
  if (mode === 'fix') { const g = new THREE.Group(); g.rotation.x = Math.PI/2; g.add(root); root = g; }
  scene.add(root);

  // Ground plane at y=0 so "which way is up" is unmistakable.
  const gridHelper = new THREE.GridHelper(20, 20, 0xff4444, 0x335533);
  scene.add(gridHelper);

  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z);
  const cam = new THREE.PerspectiveCamera(42, 1, 0.05, 500);
  if (view === 'front') cam.position.set(center.x, center.y, center.z - radius * 1.7);
  else if (view === 'back') cam.position.set(center.x, center.y, center.z + radius * 1.7);
  else if (view === 'top') cam.position.set(center.x, center.y + radius * 1.7, center.z + 0.001);
  else cam.position.set(center.x + radius * 1.1, center.y + radius * 0.75, center.z + radius * 1.35);
  cam.lookAt(center);
  gridHelper.scale.setScalar(Math.max(1, radius / 6));
  renderer.render(scene, cam);
  label.textContent += ` | ${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)}`;
}
document.title = 'READY';
</script></body></html>
